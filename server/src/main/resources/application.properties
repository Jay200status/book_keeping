# Spring Boot 会自动读取此文件。敏感值通过环境变量注入，不要把真实密钥提交到仓库。
server.port=${PORT:3000}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

app.mini-app-id=${MINI_APP_ID:}
app.mini-app-secret=${MINI_APP_SECRET:}
app.official-app-id=${OFFICIAL_APP_ID:}
app.official-app-secret=${OFFICIAL_APP_SECRET:}
app.wechat-token=${WECHAT_TOKEN:}
app.wechat-encoding-aes-key=${WECHAT_ENCODING_AES_KEY:}
app.bind-secret=${BIND_SECRET:}
app.admin-bootstrap-user=${ADMIN_BOOTSTRAP_USER:}
app.admin-bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.mini-reminder-template-id=${MINI_REMINDER_TEMPLATE_ID:}
app.mini-reminder-title-key=${MINI_REMINDER_TITLE_KEY:thing1}
app.mini-reminder-time-key=${MINI_REMINDER_TIME_KEY:time2}
app.mini-reminder-content-key=${MINI_REMINDER_CONTENT_KEY:thing3}
app.mini-reminder-page=${MINI_REMINDER_PAGE:pages/me/index}
